[package]
name = "tensorrs"
version = "0.4.0"
authors = ["Anton Krop antonjobonly@gmail.com"]
edition = "2021"
description = "A lightweight machine learning library with autodiff, tensors and neural network layers"
repository = "https://github.com/GooseKIller/Tensors"
license = "MIT"
readme = "README.md"
keywords = ["machine-learning", "neural-network", "tensor", "autodiff", "deep-learning"]
categories = ["science", "mathematics"]

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "assets/katex.html"]

[dependencies]
rand = "0.8"
rayon = "1.11.0"
